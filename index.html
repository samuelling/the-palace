<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>The Palace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap">
<style>
/* Layout: a single lamp-lit stage (4:3 canvas) with a parchment sheet that slides over it; controls sit below like a brass control plate. Deliberately single dark theme. */
:root{
  --ink:#0e0c0b; --soot:#1a1614; --wall:#2c2520; --brass:#e0a84a; --brass-dim:#8a6a33;
  --blood:#a8372f; --fog:#9aa49e; --paper:#e2d6bd; --paper-ink:#2a221b; --muted:#91877a;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --type:"Special Elite", "Courier New", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;color:var(--brass)}
#where{font-family:var(--type);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;background:#000;border:1px solid var(--wall);overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:100%}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:88%;font-family:var(--type);font-size:.85rem;
  color:var(--paper);background:rgba(14,12,11,.82);border:1px solid var(--brass-dim);padding:6px 12px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,4,.72);padding:12px}
.sheet{background:var(--paper);color:var(--paper-ink);max-width:560px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);border:1px solid #b9a988}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0 0 8px;text-wrap:balance;letter-spacing:.03em}
.sheet p{margin:0 0 10px;line-height:1.45}
.sheet .note{font-family:var(--type);font-size:.92rem;line-height:1.5}
.sheet .small{font-size:.82rem;color:#5d5246}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font-family:var(--type);font-size:.95rem;letter-spacing:.04em;cursor:pointer;border-radius:2px}
.sheet button{background:var(--paper-ink);color:var(--paper);border:1px solid var(--paper-ink);padding:9px 14px}
.sheet button.ghost{background:transparent;color:var(--paper-ink)}
.sheet button:focus-visible,#controls button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sheet canvas{display:block;max-width:100%;margin:6px auto;background:#1b1714}
#controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;min-height:52px;align-items:center}
.plate{background:var(--soot);color:var(--brass);border:1px solid var(--brass-dim);padding:12px 22px;font-size:1rem;min-width:120px}
.plate:active{background:var(--wall)}
#pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{background:var(--soot);color:var(--brass);border:1px solid var(--brass-dim);font-size:1.2rem;touch-action:none}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#odd{background:transparent;color:var(--blood);border:1px solid var(--blood);padding:10px 16px}
.keys{font-family:var(--type);font-size:.75rem;color:var(--muted);text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:8px auto}
.grid3 button{padding:12px 0}
.codeshow{font-family:var(--type);font-size:2rem;letter-spacing:.4em;text-align:center;margin:8px 0}
/* ledger */
.ledger h2{font-size:1.6rem}
.entry{border-top:1px solid #b9a988;padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.entry .k{font-family:var(--display);font-size:1.02rem}
.entry .v{font-family:var(--type);font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right}
.entry .m{grid-column:1/-1;font-size:.84rem;color:#5d5246;line-height:1.4}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <div class="bar"><span class="brand">The Palace</span><span id="where">Beta · Locke Hall, East Wing</span></div>
  <div id="stage">
    <canvas id="cv" aria-label="Game view"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="panel" hidden><div class="sheet" id="sheet"></div></div>
  </div>
  <div id="controls">
    <div id="driveCtl" hidden style="display:flex;gap:14px">
      <button class="plate" id="bStatue">Statue (F)</button>
      <button class="plate" id="bGhoul">Ghoul (J)</button>
    </div>
    <div id="pad" hidden>
      <button class="u" data-d="0,-1" aria-label="Move up">▲</button>
      <button class="l" data-d="-1,0" aria-label="Move left">◀</button>
      <button class="d" data-d="0,1" aria-label="Move down">▼</button>
      <button class="r" data-d="1,0" aria-label="Move right">▶</button>
    </div>
    <button id="odd" hidden>Something's wrong here</button>
  </div>
  <div class="keys" id="keys">Arrow keys or WASD to move. Walk into objects to examine them.</div>
</div>

<script>
/* ---------- core ---------- */
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
const now=()=>performance.now();
const mean=a=>a.reduce((s,x)=>s+x,0)/Math.max(1,a.length);
const variance=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/Math.max(1,a.length-1);};
const S={phase:'title',modal:false,log:{steps:0,hits:0,hitsDuringHold:0},start:now()};
let W=640,H=480;
function resize(){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',resize);
let toastT=0;
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}
function setWhere(s){$('#where').textContent=s;}
function openPanel(html,mount){$('#sheet').innerHTML=html;$('#panel').hidden=false;S.modal=true;if(mount)mount($('#sheet'));const b=$('#sheet button');if(b)b.focus();}
function closePanel(){$('#panel').hidden=true;S.modal=false;}

/* ---------- sound (starts after first click) ---------- */
let AC=null;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function thud(delay=0,vol=.6){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(32,t+.25);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.45);}

/* ---------- EZ-diffusion (Wagenmakers, van der Maas & Grasman, 2007) ---------- */
function ezDiffusion(tr){
  const n=tr.length;let pc=tr.filter(t=>t.correct).length/n;
  let edge=false;
  if(pc>=1){pc=1-1/(2*n);edge=true;} if(pc<=.5){pc=.5+1/(2*n);edge=true;}
  const crt=tr.filter(t=>t.correct).map(t=>t.rt);
  const mrt=mean(crt),vrt=Math.max(variance(crt),1e-4),s=.1,L=Math.log(pc/(1-pc));
  const x=L*(L*pc*pc-L*pc+pc-.5)/vrt, v=Math.sign(pc-.5)*s*Math.pow(x,.25);
  const a=s*s*L/v, y=-v*a/(s*s), mdt=(a/(2*v))*(1-Math.exp(y))/(1+Math.exp(y));
  return {v,a,ter:mrt-mdt,pc:tr.filter(t=>t.correct).length/n,mrt,n,edge};
}

/* ---------- procedural crests (for the mnemonic similarity lock) ---------- */
function newCrest(){return {h:RI(0,359),ang:R(0,180),ch:RI(0,3),n:RI(1,3),band:Math.random()<.5};}
function lureOf(p){const q={...p},k=RI(0,2),sg=Math.random()<.5?-1:1;
  if(k===0)q.ang=(p.ang+sg*R(26,38)+360)%180; else if(k===1)q.n=p.n===3?2:p.n+1; else q.h=(p.h+sg*R(28,40)+360)%360; return q;}
function drawCrest(c,p,x,y,sz){
  c.save();c.translate(x,y);const w=sz*.8,h=sz;
  c.beginPath();c.moveTo(-w/2,-h/2);c.lineTo(w/2,-h/2);c.lineTo(w/2,0);c.quadraticCurveTo(w/2,h*.35,0,h/2);c.quadraticCurveTo(-w/2,h*.35,-w/2,0);c.closePath();
  c.save();c.clip();
  c.fillStyle=`hsl(${p.h},38%,30%)`;c.fillRect(-w,-h,2*w,2*h);
  c.save();c.rotate(p.ang*Math.PI/180);c.fillStyle=`hsl(${p.h},28%,62%)`;c.fillRect(0,-h,h*2,h*2);c.restore();
  if(p.band){c.strokeStyle='rgba(20,15,10,.55)';c.lineWidth=sz*.09;c.beginPath();c.moveTo(-w/2,h*.15);c.lineTo(0,-h*.12);c.lineTo(w/2,h*.15);c.stroke();}
  const pos=p.n===1?[[0,0]]:p.n===2?[[-w*.2,0],[w*.2,0]]:[[0,-h*.17],[-w*.2,h*.12],[w*.2,h*.12]];
  pos.forEach(([px,py])=>charge(c,p.ch,px,py,sz*(p.n===1?.22:.15),p.h));
  c.restore();
  c.lineWidth=Math.max(1,sz*.035);c.strokeStyle='#c9a35a';c.stroke();c.restore();
}
function charge(c,t,x,y,r,h){c.save();c.translate(x,y);c.fillStyle='#e8c46a';c.strokeStyle='#e8c46a';
  if(t===0){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fill();}
  else if(t===1){c.beginPath();c.arc(0,0,r,0,7);c.fill();c.fillStyle=`hsl(${h},38%,22%)`;c.beginPath();c.arc(r*.45,-r*.2,r*.82,0,7);c.fill();}
  else if(t===2){c.lineWidth=r*.28;c.beginPath();c.arc(0,-r*.55,r*.38,0,7);c.stroke();c.fillRect(-r*.12,-r*.2,r*.24,r*1.2);c.fillRect(0,r*.55,r*.4,r*.18);c.fillRect(0,r*.8,r*.3,r*.18);}
  else{c.beginPath();c.moveTo(-r,0);c.quadraticCurveTo(0,-r*.9,r,0);c.quadraticCurveTo(0,r*.9,-r,0);c.fill();c.fillStyle='#1a1410';c.beginPath();c.arc(0,0,r*.32,0,7);c.fill();}
  c.restore();}
/* ---------- Scene 1: the drive (threat triage → EZ-diffusion) ---------- */
const D={trials:[],amp:7,sigma:2.4,i:0,nStair:8,nFix:16,streak:0,cur:null,trees:[],fog:[]};
function seedDrive(){D.trees=Array.from({length:14},()=>({x:Math.random(),h:R(.35,.7),w:R(.03,.07)}));
  D.fog=Array.from({length:9},()=>({x:Math.random(),y:R(.35,.85),r:R(.18,.4),vx:R(-.012,.012),a:R(.18,.34)}));}
function startDrive(){
  S.phase='drive';setWhere('The drive · calibration');seedDrive();
  $('#driveCtl').hidden=false;$('#pad').hidden=true;$('#keys').textContent='F = Statue · J = Ghoul';
  nextDriveTrial();
}
function nextDriveTrial(){
  if(D.i>=D.nStair+D.nFix)return endDrive();
  D.cur={ghoul:Math.random()<.5,x:R(.28,.72),onset:now()+R(700,1300),amp:D.amp,p1:R(0,6.3),p2:R(0,6.3),p3:R(0,6.3),done:false};
  const c=D.cur;c.timer=setTimeout(()=>{if(!c.done)driveRespond(null);},3000+(c.onset-now()));
}
function driveRespond(saidGhoul){
  const c=D.cur;if(!c||c.done||S.modal)return;const t=now();if(t<c.onset)return;
  c.done=true;clearTimeout(c.timer);
  const rt=Math.min(3,(t-c.onset)/1000),correct=saidGhoul===c.ghoul,stair=D.i<D.nStair;
  D.trials.push({rt,correct,amp:c.amp,stair,timeout:saidGhoul===null});
  if(stair){if(correct){if(++D.streak>=2){D.amp=Math.max(.8,D.amp*.72);D.streak=0;}}else{D.amp=Math.min(14,D.amp*1.4);D.streak=0;}}
  D.i++;
  toast(saidGhoul===null?'Too slow. The shape is gone.':c.ghoul?(correct?'It moved. You saw it.':'It moved. You missed it.'):(correct?'Only stone.':'Only stone. Your eyes played tricks.'),900);
  D.cur=null;setTimeout(nextDriveTrial,650);
}
function endDrive(){
  $('#driveCtl').hidden=true;
  const fit=ezDiffusion(D.trials.filter(t=>!t.stair));
  S.log.drive={...fit,amp:D.amp,sigma:D.sigma};
  S.phase='letter';
  openPanel(`<h2>The front door is unlocked</h2>
   <p class="note">"Come quickly. I can no longer find the rooms. Clara's things keep moving. The house does not stay where I put it. — E. L."</p>
   <p>Inside, the foyer is cold. A framed plan of the house hangs by the door. It is the only map you will find here, and it does not leave the wall.</p>
   <div class="row"><button id="go">Enter Locke Hall</button></div>`,s=>s.querySelector('#go').onclick=()=>{closePanel();startExplore();});
}
function renderDrive(t){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d10');g.addColorStop(.6,'#151a1a');g.addColorStop(1,'#0a0a09');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#0a0c0c';D.trees.forEach(tr=>{const x=tr.x*W,b=H*.72;cx.beginPath();cx.moveTo(x-tr.w*W,b);cx.lineTo(x,b-tr.h*H);cx.lineTo(x+tr.w*W,b);cx.fill();});
  cx.fillStyle='#0c0b0a';cx.fillRect(0,H*.72,W,H*.28);
  const c=D.cur;
  if(c&&!c.done&&t>=c.onset){
    const s=(t-c.onset)/1000,fade=Math.min(1,s/.3);
    let dx=D.sigma*(Math.sin(s*3.3+c.p1)+Math.sin(s*5.1+c.p2))/1.4*(W/640);
    if(c.ghoul)dx+=c.amp*Math.sin(2*Math.PI*1.5*s+c.p3)*(W/640);
    figure(c.x*W+dx,H*.72,H*.3,fade);
  }
  D.fog.forEach(f=>{f.x+=f.vx*.016;if(f.x<-.3)f.x=1.3;if(f.x>1.3)f.x=-.3;
    const gx=cx.createRadialGradient(f.x*W,f.y*H,0,f.x*W,f.y*H,f.r*W);gx.addColorStop(0,`rgba(154,164,158,${f.a})`);gx.addColorStop(1,'rgba(154,164,158,0)');cx.fillStyle=gx;cx.fillRect(0,0,W,H);});
  cx.fillStyle='rgba(224,168,74,.75)';cx.font=`${Math.max(11,W/48)}px "Special Elite",monospace`;
  cx.fillText(`Shape ${Math.min(D.i+1,D.nStair+D.nFix)} of ${D.nStair+D.nFix}`,14,22);
}
function figure(x,base,h,a){cx.save();cx.globalAlpha=a*.92;cx.fillStyle='#2b2f2e';
  cx.beginPath();cx.arc(x,base-h*.88,h*.08,0,7);cx.fill();
  cx.beginPath();cx.moveTo(x-h*.16,base-h*.76);cx.lineTo(x+h*.16,base-h*.76);cx.lineTo(x+h*.12,base-h*.3);cx.lineTo(x+h*.1,base);cx.lineTo(x-h*.1,base);cx.lineTo(x-h*.12,base-h*.3);cx.closePath();cx.fill();
  cx.fillRect(x-h*.15,base-h*.06,h*.3,h*.06);cx.restore();}
$('#bStatue').onclick=()=>driveRespond(false);$('#bGhoul').onclick=()=>driveRespond(true);
/* ---------- Locke Hall: map, movement, light ---------- */
const MW=26,MH=18;let G=[],OBJ={};
const P={x:11,y:13,rx:11,ry:13,fx:0,fy:-1};
const Gh={x:9,y:7,dir:1,last:0,active:true};
const CRESTS=Array.from({length:6},newCrest);
S.lamp=3.3;S.nextMove=0;S.shakeUntil=0;S.flashUntil=0;S.room=null;S.seen=new Set();S.crestsSeen=new Set();S.items={};
function carve(x0,y0,x1,y1,c='.'){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)G[y][x]=c;}
function buildMap(){
  G=Array.from({length:MH},()=>Array(MW).fill('#'));
  carve(1,1,7,5);carve(16,1,22,5);carve(2,7,21,7);carve(8,9,14,15);carve(1,9,6,15);
  G[8][11]='.';G[12][7]='.';G[6][4]='A';G[6][19]='B';
  carve(23,3,24,3);carve(24,3,24,10);carve(18,10,24,10);carve(18,10,18,13);carve(16,13,18,13);G[13][15]='E';
}
function placeObjects(){
  const o=(x,y,t,extra={})=>OBJ[x+','+y]={t,x,y,...extra};
  o(9,9,'map');o(13,9,'portrait');o(14,11,'clock');
  [[1,10],[1,13],[3,9],[5,9],[3,15],[5,15]].forEach(([x,y],i)=>o(x,y,'crest',{i}));
  o(4,12,'glove');o(6,2,'book');o(2,4,'music');o(17,2,'desk');o(21,2,'locket');
}
function inCorr(x,y){return (y===3&&x>=23&&x<=24)||(x===24&&y>=3&&y<=10)||(y===10&&x>=18&&x<=24)||(x===18&&y>=10&&y<=13)||(y===13&&x>=16&&x<=18);}
function roomAt(x,y){
  if(x>=1&&x<=7&&y>=1&&y<=5)return 'Library';if(x>=16&&x<=22&&y>=1&&y<=5)return 'Study';
  if(y===7&&x>=2&&x<=21)return 'North hall';if(x>=8&&x<=14&&y>=9&&y<=15)return 'Foyer';
  if(x>=1&&x<=6&&y>=9&&y<=15)return 'Portrait gallery';if(inCorr(x,y))return "Servants' corridor";return null;}
const FLOOR={'Library':'#3a2a1c','Study':'#3b1f1c','North hall':'#2e2622','Portrait gallery':'#1f2b25',"Servants' corridor":'#262624'};
function startExplore(){
  buildMap();placeObjects();S.phase='explore';
  $('#pad').hidden=false;$('#keys').textContent='Arrow keys or WASD to move. Walk into objects to examine them.';
  S.t0=now();onEnter(P.x,P.y);
  toast('The foyer. The framed plan hangs by the door, top left.',3200);
}
function tryMove(dx,dy){
  if(S.phase!=='explore'||S.modal||now()<S.nextMove)return;S.nextMove=now()+135;
  P.fx=dx;P.fy=dy;const nx=P.x+dx,ny=P.y+dy,k=nx+','+ny;
  if(OBJ[k])return interact(OBJ[k]);
  const ch=G[ny]&&G[ny][nx];if(!ch||ch==='#')return;
  if(ch==='A')return doorA();if(ch==='B')return doorB();if(ch==='E')return doorE();
  if(Gh.active&&nx===Gh.x&&ny===Gh.y)return hit();
  P.x=nx;P.y=ny;S.log.steps++;onEnter(nx,ny);
}
function onEnter(x,y){
  const r=roomAt(x,y);
  if(r&&r!==S.room){S.room=r;setWhere('Locke Hall · '+r);if(!S.seen.has(r)){S.seen.add(r);if(r!=='Foyer')toast(r+'.',1400);}}
  if(x===23&&y===3&&!S.darkStart){S.darkStart=now();S.lamp=.85;toast('Your flashlight sputters and dies.',2600);}
  if(x===17&&y===13&&S.darkStart&&!S.pointed)pointing();
  if(r==='Foyer'&&S.pointed&&!S.changeAt)armChange();
}
function hit(){
  S.log.hits++;if(S.code&&!S.codeDone)S.log.hitsDuringHold++;
  S.shakeUntil=now()+380;S.flashUntil=now()+260;thud(0,.5);toast('Cold hands catch your sleeve. You wrench free.',1600);
  const bx=P.x-P.fx,by=P.y-P.fy;if(G[by]&&G[by][bx]==='.'&&!OBJ[bx+','+by]){P.x=bx;P.y=by;}
}
function updateGhoul(t){
  if(!Gh.active||S.modal||t-Gh.last<540)return;Gh.last=t;
  let nx=Gh.x+Gh.dir;if(nx>18||nx<8){Gh.dir*=-1;nx=Gh.x+Gh.dir;}
  if(nx===P.x&&Gh.y===P.y){hit();return;}Gh.x=nx;
}
function renderExplore(t){
  updateGhoul(t);
  const ts=Math.floor(Math.min(W/11,H/8.25));P.rx+=(P.x-P.rx)*.3;P.ry+=(P.y-P.ry)*.3;
  let ox=W/2-(P.rx+.5)*ts,oy=H/2-(P.ry+.5)*ts;
  if(t<S.shakeUntil){ox+=R(-5,5);oy+=R(-5,5);}
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);

    ${E('Plan study time',f(L.mapTime||0,0)+' s','Time spent reading the only map in the house. A strategy marker, and a covariate for every navigation score.')}
    ${E('Sessions on record',String(hist.length),iiv==null?'Drift-rate variability across days is the signal this design is built around. Play again on another day to start that series.':`Drift-rate variability across sessions: SD = ${f(iiv,3)}. This is the day-to-day noise that tends to rise before averages fall.`)}
    <p class="small" style="margin-top:12px">Beta. Each value is a single-session point estimate from a short tutorial block. The models are meant to be fit across many sessions, where change over time carries the information.</p>
    <div class="row"><button id="again">Play again</button></div></div>`,s=>s.querySelector('#again').onclick=()=>location.reload());
}
/* ---------- boot ---------- */
function frame(t){
  if(S.phase==='explore')renderExplore(t);else renderDrive(t);
  requestAnimationFrame(frame);
}
resize();seedDrive();requestAnimationFrame(frame);
openPanel(`<h2>The Palace</h2>
  <p>A letter arrived from Dr. Elias Locke, in handwriting that shook: <i>"Come quickly. I can no longer find the rooms."</i></p>
  <p>Your car dies at the bottom of the drive. Shapes wait among the trees between you and Locke Hall. Most are garden statues. Some are not.</p>
  <p class="small">If a shape sways, it's a ghoul. Decide as quickly and accurately as you can: Statue (F) or Ghoul (J). Sound on for the full effect.</p>
  <div class="row"><button id="go">Walk up the drive</button></div>`,
  s=>s.querySelector('#go').onclick=()=>{audio();closePanel();startDrive();});
</script>

</html>
